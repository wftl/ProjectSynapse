    <!-- EP {{NUMBER}} -->
    <div class="episode-card">
      <div class="embed-wrap">
        <a class="video-facade" href="https://www.youtube.com/watch?v={{YOUTUBE_ID}}" target="_blank" rel="noopener" data-youtube-id="{{YOUTUBE_ID}}" data-title="{{TITLE_ATTR}}" aria-label="Watch {{TITLE_ATTR}} on YouTube">
          <img src="https://i.ytimg.com/vi/{{YOUTUBE_ID}}/maxresdefault.jpg" alt="Thumbnail for {{TITLE_ATTR}}" loading="lazy" onload="if (this.naturalWidth === 120 &amp;&amp; this.onerror) this.onerror()" onerror="this.onerror = null; this.src = 'https://i.ytimg.com/vi/{{YOUTUBE_ID}}/hqdefault.jpg'">
          <span class="play-button" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        </a>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="ep-number">Ep {{NUMBER}}</span>
          <span class="ep-date">{{DATE}}</span>
        </div>
        <div class="card-title">{{TITLE}}</div>
        <div class="card-description collapsed">{{BLURB}}</div>
{{TOGGLE_BUTTON}}        <a class="watch-link" href="https://www.youtube.com/watch?v={{YOUTUBE_ID}}" target="_blank" rel="noopener">
          Watch on YouTube
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
